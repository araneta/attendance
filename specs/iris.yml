  # Database type: postgres, mysql, sqlite
  type: "postgres"
  
  # PostgreSQL Configuration
  postgres:
    host: "localhost"
    port: 5432
    user: "attendance"
    password: "4}ndU03{QI7w"
    dbname: "attendance"
    sslmode: "disable"
    timezone: "Asia/Jakarta"
  
  # MySQL Configuration (alternative)
  mysql:
    host: "localhost"
    port: 3306
    user: "root"
    password: "yourpassword"
    dbname: "attendance"
